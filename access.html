<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>J&G DIAMANT · Zugang</title><style>:root{--bg:#050505;--panel:#0c0c0b;--gold:#d9bc6a;--gold2:#a9822f;--txt:#f4efe5;--muted:#aaa49a;--line:rgba(217,188,106,.28)}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(800px 500px at 50% -10%,rgba(217,188,106,.10),transparent 65%),var(--bg);color:var(--txt);font-family:Arial,sans-serif}.wrap{width:min(720px,calc(100% - 28px));margin:auto;padding:34px 0 60px}.card{background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 28px 70px rgba(0,0,0,.35)}.brand{text-align:center;margin-bottom:22px}.brand img{width:110px;max-width:30vw}.brand h1{font:34px Georgia,serif;letter-spacing:.11em;margin:8px 0;color:var(--txt)}.brand p{margin:0;color:var(--muted)}input{width:100%;background:#080808;border:1px solid rgba(255,255,255,.11);color:#fff;border-radius:12px;padding:15px 14px;margin:6px 0;font-size:16px}.row{display:grid;grid-template-columns:.42fr 1fr;gap:8px}.btn{width:100%;border:1px solid var(--line);border-radius:999px;padding:14px 18px;background:transparent;color:var(--gold);font-weight:800;font-size:15px;margin-top:9px}.btn.gold{border:0;background:linear-gradient(135deg,#ead282,#aa8030);color:#080808}.mini{background:none;border:0;color:var(--gold);text-decoration:underline;padding:10px 4px;font-size:14px}.hidden{display:none!important}.msg{min-height:24px;margin-top:12px;color:var(--muted);font-size:13px;line-height:1.5}.notice{color:var(--muted);font-size:12px;line-height:1.55;padding:12px 2px}.ey{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}@media(max-width:520px){.wrap{padding-top:18px}.card{padding:18px;border-radius:20px}.brand h1{font-size:29px}.row{grid-template-columns:.42fr 1fr}}</style></head><body><main class="wrap"><section class="card"><div class="brand"><img src="assets/diamond-transparent.png" alt="J&G Diamant"><div class="ey">Private Client Access</div><h1>J&G DIAMANT</h1><p>Private Client & Operations Platform</p></div><div id="loginBox"><input id="email" type="email" autocomplete="email" placeholder="E-Mail"><input id="password" type="password" autocomplete="current-password" placeholder="Passwort"><button class="btn gold" id="loginBtn">ANMELDEN</button><button class="btn" id="showRegister">NEUES KUNDENKONTO</button><button class="mini" id="forgotBtn">Passwort vergessen?</button></div><div id="registerBox" class="hidden"><input id="regName" autocomplete="name" placeholder="Vor- und Nachname"><input id="regPhone" type="tel" autocomplete="tel" placeholder="Telefon"><input id="regCompany" autocomplete="organization" placeholder="Firma / Haushalt (optional)"><input id="regStreet" autocomplete="street-address" placeholder="Strasse / Hausnummer"><div class="row"><input id="regPostal" autocomplete="postal-code" placeholder="PLZ"><input id="regCity" autocomplete="address-level2" placeholder="Ort"></div><input id="regCountry" autocomplete="country-name" value="Schweiz" placeholder="Land"><input id="regEmail" type="email" autocomplete="email" placeholder="E-Mail"><input id="regPassword" type="password" autocomplete="new-password" placeholder="Passwort (mind. 10 Zeichen)"><div class="notice">Mit der Registrierung eröffnen Sie Ihr persönliches J&G Kundenkonto. Ihre Angaben werden für Betreuung, Offerten, Rechnungen und Fahrservice-Anfragen verwendet.</div><button class="btn gold" id="registerBtn">PRIVATES KUNDENKONTO ERÖFFNEN</button><button class="btn" id="showLogin">ZUR ANMELDUNG</button></div><div class="msg" id="msg"></div></section></main><script>const U='https://qgrsbqzhbifbyyfbslyh.supabase.co',K='sb_publishable_DKxNrYb1zbLkKyQQ_LAh2w_B0NRK72k',SK='jgos:session';const $=id=>document.getElementById(id);const H={'apikey':K,'Content-Type':'application/json'};function emailOk(v){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v)}function setMsg(t){$('msg').textContent=t||''}async function req(path,opt={}){const r=await fetch(U+path,{...opt,headers:{...H,...(opt.headers||{})}});const t=await r.text();let d=null;try{d=t?JSON.parse(t):null}catch{d=t}if(!r.ok)throw Error(d?.message||d?.error_description||t||'Vorgang fehlgeschlagen');return d}async function login(){const email=$('email').value.trim(),password=$('password').value;if(!emailOk(email)||!password)return setMsg('Bitte E-Mail und Passwort eingeben.');setMsg('Anmeldung …');$('loginBtn').disabled=true;try{const s=await req('/auth/v1/token?grant_type=password',{method:'POST',body:JSON.stringify({email,password})});localStorage.setItem(SK,JSON.stringify(s));location.replace('app.html')}catch(e){setMsg(e.message)}finally{$('loginBtn').disabled=false}}async function register(){const p={full_name:$('regName').value.trim(),phone:$('regPhone').value.trim(),company:$('regCompany').value.trim(),street:$('regStreet').value.trim(),postal_code:$('regPostal').value.trim(),city:$('regCity').value.trim(),country:$('regCountry').value.trim()||'Schweiz'},email=$('regEmail').value.trim(),password=$('regPassword').value;if(!p.full_name||!p.phone||!p.street||!p.postal_code||!p.city||!emailOk(email)||password.length<10)return setMsg('Bitte alle Pflichtangaben ausfüllen; Passwort mindestens 10 Zeichen.');setMsg('Konto wird erstellt …');$('registerBtn').disabled=true;try{const d=await req('/auth/v1/signup',{method:'POST',body:JSON.stringify({email,password,data:{...p,email}})});if(d?.access_token){localStorage.setItem(SK,JSON.stringify(d));location.replace('app.html')}else{setMsg('Konto erstellt. Bitte bestätigen Sie Ihre E-Mail und melden Sie sich danach an.');$('email').value=email;$('registerBox').classList.add('hidden');$('loginBox').classList.remove('hidden')}}catch(e){setMsg(e.message)}finally{$('registerBtn').disabled=false}}async function forgot(){const email=$('email').value.trim()||prompt('E-Mail-Adresse Ihres J&G Kundenkontos');if(!emailOk(email||''))return setMsg('Bitte eine gültige E-Mail-Adresse eingeben.');setMsg('Reset-Link wird angefordert …');try{await req('/auth/v1/recover?redirect_to='+encodeURIComponent(location.origin+'/access.html#recovery'),{method:'POST',body:JSON.stringify({email})});setMsg('Wenn ein Konto zu dieser Adresse besteht, wurde ein Reset-Link versendet.')}catch{setMsg('Der Vorgang konnte gerade nicht abgeschlossen werden.')}}async function recovery(){const q=new URLSearchParams(location.hash.replace(/^#/,''));if(!location.hash.includes('recovery')&&!q.get('type'))return;const token=q.get('access_token');if(!token)return;const password=prompt('Neues Passwort (mindestens 10 Zeichen)');if(!password||password.length<10)return setMsg('Das Passwort muss mindestens 10 Zeichen enthalten.');try{await req('/auth/v1/user',{method:'PUT',headers:{Authorization:'Bearer '+token},body:JSON.stringify({password})});history.replaceState(null,'',location.pathname);setMsg('Passwort geändert. Sie können sich jetzt anmelden.')}catch{setMsg('Der Reset-Link ist ungültig oder abgelaufen.')}}$('showRegister').onclick=()=>{$('loginBox').classList.add('hidden');$('registerBox').classList.remove('hidden');setMsg('')};$('showLogin').onclick=()=>{$('registerBox').classList.add('hidden');$('loginBox').classList.remove('hidden');setMsg('')};$('loginBtn').onclick=login;$('registerBtn').onclick=register;$('forgotBtn').onclick=forgot;try{const s=JSON.parse(localStorage.getItem(SK)||'null');if(s?.access_token&&!location.hash)location.replace('app.html')}catch{}recovery();</script></body></html>
