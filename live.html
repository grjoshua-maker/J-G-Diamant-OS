<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>J&G OS</title>
<style>
html,body{margin:0;min-height:100%;background:#050505;color:#f4efe5;font-family:Arial,sans-serif}
#loading{padding:32px;text-align:center;color:#d9bc6a}
#error{display:none;padding:24px;margin:24px;border:1px solid #7b2929;border-radius:14px;color:#ffb1b1}
.jgos-recovery-link{display:block;width:100%;margin:12px 0 0;padding:8px;border:0;background:transparent;color:#d9bc6a;font:inherit;text-decoration:underline;cursor:pointer}
.jgos-reset{margin-top:14px;padding-top:14px;border-top:1px solid rgba(217,188,106,.25)}
.jgos-reset input{box-sizing:border-box;width:100%;margin:6px 0;padding:16px;border:1px solid #292929;border-radius:12px;background:#090909;color:#fff;font:inherit}
.jgos-reset button{width:100%;margin-top:8px;padding:15px;border:0;border-radius:12px;background:#d9bc6a;color:#080808;font-weight:700}
.jgos-reset-msg{margin-top:10px;color:#bdb7ad;font-size:14px}
</style>
</head>
<body>
<div id="loading">J&G OS wird geladen …</div>
<div id="error"></div>
<script>
(async()=>{
  const v='20260824-2245';
  const U='https://qgrsbqzhbifbyyfbslyh.supabase.co';
  const K='sb_publishable_DKxNrYb1zbLkKyQQ_LAh2w_B0NRK72k';
  const SK='jgos:session';
  const hash=new URLSearchParams(location.hash.replace(/^#/,''));
  const query=new URLSearchParams(location.search);
  const recoveryType=hash.get('type')||query.get('type');
  const recoveryToken=hash.get('access_token')||query.get('access_token');
  const err=t=>{const b=document.getElementById('error');if(b){b.style.display='block';b.textContent=t}};

  async function refreshSession(s){
    if(!s?.refresh_token)return s;
    try{
      const r=await fetch(U+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:s.refresh_token}),cache:'no-store'});
      if(!r.ok)return s;
      const n=await r.json();
      localStorage.setItem(SK,JSON.stringify(n));
      return n;
    }catch{return s}
  }

  function installRecovery(){
    const login=document.querySelector('#auth .login'),loginBtn=document.querySelector('#loginBtn');
    if(!login||!loginBtn)return;
    const forgot=document.createElement('button');
    forgot.type='button';forgot.className='jgos-recovery-link';forgot.textContent='Passwort vergessen?';
    loginBtn.insertAdjacentElement('afterend',forgot);
    const box=document.createElement('div');
    box.className='jgos-reset';box.hidden=true;
    box.innerHTML='<input id="jgosResetEmail" type="email" placeholder="E-Mail"><button type="button" id="jgosResetSend">RESET-LINK SENDEN</button><div class="jgos-reset-msg" id="jgosResetMsg"></div>';
    forgot.insertAdjacentElement('afterend',box);
    forgot.onclick=()=>{box.hidden=!box.hidden};
    box.querySelector('#jgosResetSend').onclick=async()=>{
      const email=box.querySelector('#jgosResetEmail').value.trim(),m=box.querySelector('#jgosResetMsg');
      if(!email){m.textContent='Bitte E-Mail-Adresse eingeben.';return}
      m.textContent='Reset-Link wird gesendet …';
      try{
        const redirect=location.origin+location.pathname;
        const r=await fetch(U+'/auth/v1/recover?redirect_to='+encodeURIComponent(redirect),{method:'POST',headers:{apikey:K,'Content-Type':'application/json'},body:JSON.stringify({email}),cache:'no-store'});
        if(!r.ok)throw new Error((await r.text())||'Reset konnte nicht gesendet werden.');
        m.textContent='E-Mail versendet. Bitte den Link in der E-Mail öffnen.';
      }catch(e){m.textContent='Fehler: '+e.message}
    };
    if(recoveryType==='recovery'&&recoveryToken){
      document.querySelector('#auth')?.classList.remove('hidden');
      document.querySelector('#auth .form')?.setAttribute('style','display:none');
      loginBtn.style.display='none';
      document.querySelector('#showRegister')?.setAttribute('style','display:none');
      forgot.style.display='none';box.hidden=false;
      box.innerHTML='<input id="jgosNewPassword" type="password" placeholder="Neues Passwort (mind. 10 Zeichen)"><input id="jgosNewPassword2" type="password" placeholder="Passwort wiederholen"><button type="button" id="jgosPasswordSave">NEUES PASSWORT SPEICHERN</button><div class="jgos-reset-msg" id="jgosResetMsg"></div>';
      box.querySelector('#jgosPasswordSave').onclick=async()=>{
        const p=box.querySelector('#jgosNewPassword').value,p2=box.querySelector('#jgosNewPassword2').value,m=box.querySelector('#jgosResetMsg');
        if(p.length<10){m.textContent='Das Passwort muss mindestens 10 Zeichen haben.';return}
        if(p!==p2){m.textContent='Die Passwörter stimmen nicht überein.';return}
        m.textContent='Passwort wird gespeichert …';
        try{
          const r=await fetch(U+'/auth/v1/user',{method:'PUT',headers:{apikey:K,Authorization:'Bearer '+recoveryToken,'Content-Type':'application/json'},body:JSON.stringify({password:p}),cache:'no-store'});
          if(!r.ok)throw new Error((await r.text())||'Passwort konnte nicht gespeichert werden.');
          localStorage.removeItem(SK);history.replaceState(null,'',location.pathname);m.textContent='Passwort geändert. Sie können sich jetzt anmelden.';setTimeout(()=>location.reload(),1200);
        }catch(e){m.textContent='Fehler: '+e.message}
      };
    }
  }

  try{
    const r=await fetch('app.html?v='+v,{cache:'no-store'});
    if(!r.ok)throw new Error('app.html '+r.status);
    const html=await r.text(),d=new DOMParser().parseFromString(html,'text/html');
    document.title=d.title||'J&G OS';
    d.head.querySelectorAll('link[rel="stylesheet"]').forEach(x=>{const l=document.createElement('link'),u=new URL(x.getAttribute('href'),location.href);u.searchParams.set('v',v);l.rel='stylesheet';l.href=u.href;document.head.appendChild(l)});
    document.body.innerHTML=d.body.innerHTML.replace(/<script[\s\S]*?<\/script>/gi,'');
    installRecovery();
    if(recoveryType==='recovery'&&recoveryToken)return;

    /* Refresh first, then let app.js be the single authority for role/profile rendering. */
    try{
      const stored=JSON.parse(localStorage.getItem(SK)||'null');
      if(stored?.refresh_token)await refreshSession(stored);
    }catch{localStorage.removeItem(SK)}

    const s=document.createElement('script');
    s.src='app.js?v='+v;s.async=false;s.onerror=()=>err('J&G OS konnte den App-Code nicht laden.');
    document.body.appendChild(s);
  }catch(e){
    const l=document.getElementById('loading');if(l)l.style.display='none';
    err('J&G OS konnte nicht geladen werden: '+e.message);
  }
})();
</script>
</body>
</html>
