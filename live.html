<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>J&G OS</title><style>html,body{margin:0;min-height:100%;background:#050505;color:#f4efe5;font-family:Arial,sans-serif}#loading{padding:32px;text-align:center;color:#d9bc6a}#error{display:none;padding:24px;margin:24px;border:1px solid #7b2929;border-radius:14px;color:#ffb1b1}</style></head><body><div id="loading">J&G OS wird geladen …</div><div id="error"></div><script>(async()=>{const v='20260824-2145';try{const r=await fetch('app.html?v='+v,{cache:'no-store'});if(!r.ok)throw new Error('app.html '+r.status);const html=await r.text();const d=new DOMParser().parseFromString(html,'text/html');document.title=d.title||'J&G OS';document.head.querySelectorAll('link[data-live]').forEach(x=>x.remove());d.head.querySelectorAll('link[rel="stylesheet"]').forEach(x=>{const l=document.createElement('link');l.rel='stylesheet';l.dataset.live='1';const u=new URL(x.getAttribute('href'),location.href);u.searchParams.set('v',v);l.href=u.href;document.head.appendChild(l)});document.body.innerHTML=d.body.innerHTML.replace(/<script[\s\S]*?<\/script>/gi,'');const s=document.createElement('script');s.src='app.js?v='+v;s.async=false;s.onerror=()=>{const e=document.createElement('div');e.style.cssText='position:fixed;inset:auto 16px 16px;z-index:99999;background:#2a0d0d;color:#ffd0d0;padding:14px;border-radius:12px';e.textContent='J&G OS konnte den App-Code nicht laden.';document.body.appendChild(e)};document.body.appendChild(s)}catch(e){document.getElementById('loading').style.display='none';const box=document.getElementById('error');box.style.display='block';box.textContent='J&G OS konnte nicht geladen werden: '+e.message}})();</script></body></html>
